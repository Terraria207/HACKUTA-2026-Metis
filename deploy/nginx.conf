# Install your own TLS certificate and bind behind an authenticated/private network.
server {
  listen 443 ssl;
  server_name metis.example.internal;
  ssl_certificate /etc/ssl/metis/fullchain.pem;
  ssl_certificate_key /etc/ssl/metis/privkey.pem;
  client_max_body_size 13m;
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
